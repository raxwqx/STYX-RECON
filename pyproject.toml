[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "styx-recon"
version = "0.2.0"
description = "Lightweight DNS reconnaissance toolkit with optional TLS certificate inspection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "STYXHQ" }]
keywords = ["dns", "reconnaissance", "osint", "security", "tls", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    "dnspython>=2.4,<3",
    "rich>=13,<15",
]

[project.optional-dependencies]
dev = ["pytest>=7,<10"]

[project.urls]
Homepage = "https://github.com/raxwqx/STYX-RECON"
Repository = "https://github.com/raxwqx/STYX-RECON"
Issues = "https://github.com/raxwqx/STYX-RECON/issues"

[project.scripts]
styx-recon = "styxrecon.cli:main"

[tool.setuptools.packages.find]
include = ["styxrecon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
